services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      # Contraseña para SYS, SYSTEM y PDBADMIN (obligatoria)
      ORACLE_PWD: TuPasswordFuerte123
      # Opcional: Juego de caracteres de la base de datos
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      # Persistencia de los datos
      - oracle-data:/opt/oracle/oradata
      # Opcional: Scripts .sql o .sh que se ejecutan solo en el primer arranque
      - ./init-scripts:/opt/oracle/scripts/startup
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

volumes:
  oracle-data: