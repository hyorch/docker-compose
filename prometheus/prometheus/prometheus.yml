global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
  - static_configs:
    - targets: []
    scheme: http
    timeout: 10s
    api_version: v2
scrape_configs:
- job_name: prometheus
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /metrics
  scheme: http
  static_configs:
  - targets:
    - localhost:9090

otlp:
  # Keep service_name, service_namespace, and service_instance_id on target_info
  keep_identifying_resource_attributes: true

  promote_resource_attributes:
    - host.name
    - host.id
    - os.type
    - cloud.region
    - cloud.availability_zone
    - deployment.environment
    - deployment.environment.name
    - service.name
    - service.namespace
    - service.instance.id
    - service.version
    - k8s.cluster.name
    - k8s.namespace.name
    - k8s.pod.name
    - k8s.node.name